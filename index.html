if(s===1){title='更接近哪一种情况？';desc='选择最贴近您的描述即可。';choices=SUB[state.answers[0].label]||SUB['我还不确定']}

if(s===3){let form=state.answers[2]?.value;title='还有一个小问题';desc='这将帮助我们排除明显不适合的选项。';choices=form==='咨询'?[['我有明确问题，想简短咨询','短时'],['我想深入梳理自己的情况','深入'],['希望长期跟进','长期'],['还不确定','不限']]:form==='学习'?[['先了解基础','基础'],['学习术数技能','术数'],['静心相关课程','静心'],['都可以','不限']]:form==='物品'?[['符箓','符箓'],['法扇或画框','法扇'],['家宅卷轴','卷轴'],['饰品或朱砂','饰品'],['还不确定','不限']]:form==='事务'?[['风水相关','风水'],['开光相关','开光'],['供香','供香'],['择日或合婚','择日'],['定制需求','定制'],['还不确定','不限']]:[['日常祈福','祈福'],['节日法会','法会'],['修行相关','修行'],['还不确定','不限']];}
if(s===4){title='是否有预算考虑？';desc='可跳过，价格不是推荐排序的依据。';choices=[['500 元以内','500'],['500～1500 元','1500'],['1500～3000 元','3000'],['3000 元以上','999999'],['暂时不考虑预算','不限'],['先看看适合的服务','不限']];}
shell(`<div class="explore-layout">${path()}<section class="question"><p class="eyebrow">第 ${s+1} / 5 步</p><h2>${esc(title)}</h2><p class="muted">${esc(desc)}</p><div class="choices">${choices.map(([label,v])=>btn(label,v)).join('')}</div><div class="subactions"><button data-action="results">先看看适合的产品</button><button data-action="restart">重新开始</button></div></section></div>`)}
function priceNum(p){let x=p.price.match(/\d+(?:\.\d+)?/);return x?Number(x[0]):null}
function score(p){let a=state.answers,primary=a[1]?.value||a[0]?.value,form=a[2]?.value,detail=a[3]?.value,budget=a[4]?.value;let t=p.tags||[],score=0,why=[];
if(!primary)return {score:0,why};if(t.includes(primary)){score+=48;why.push('与您选择的具体困扰相关')}else if(a[0]?.value&&t.includes(a[0].value)){score+=16;why.push('与您关注的方向有一定关联')}
const fm={咨询:['咨询'],仪式:['仪式','法会','祈福'],物品:['物品'],事务:['风水','择日','开光','供香','定制'],学习:['课程','学习']};if(form&&form!=='不限'){if((fm[form]||[]).some(x=>t.includes(x))){score+=27;why.push('符合您偏好的帮助方式')}else score-=35}
if(detail&&detail!=='不限'){if(t.includes(detail)){score+=20;why.push('与您进一步选择的服务条件相符')}else score-=12}
if(budget&&budget!=='不限'){let n=priceNum(p);if(n!==null&&n>Number(budget))return {score:-999,why:[]};if(n!==null){score+=5;why.push('参考价格在您选择的预算内')}}
// non-determinable pricing cannot be assumed to meet a strict budget
if(budget&&budget!=='不限'&&priceNum(p)===null)return {score:-999,why:[]};
if(['送东西','待补充'].includes(p.price))score-=15;
return {score,why};}
function matches(){return P.map(p=>({p,...score(p)})).filter(x=>x.score>=45&&x.why.length).sort((a,b)=>b.score-a.score||a.p.id.localeCompare(b.p.id)).slice(0,3)}
function summary(){return state.answers.map((a,i)=>`${STAGES[i]}：${a.label}`).join('\n')||'尚未完成探索'}
function card(p,why,rank){return `<article class="card"><div class="card-top"><span class="chip">${esc(p.category)} · ${esc(p.subcategory)}</span>${rank===0?'<span class="tag">优先匹配</span>':''}</div><h3>${esc(p.name)}</h3><div class="price">${esc(p.price)}${/^\d+$/.test(p.price)?' 元':''}</div><p>${esc(p.description)}</p><p class="reason">${why?.length?'可能适合的原因：'+esc(why.join('；')):'服务信息以原始表格为准；具体适用性待人工确认。'}</p><p class="fine">有效期／规格：${esc(p.term)}<br>注意：${esc(p.note)}<br>不适用：${esc(p.notApplicable)}</p><div class="actions"><button data-detail="${p.id}">查看详细介绍</button><button class="outline" data-consult="${p.id}">咨询这项服务</button><button data-compare="${p.id}">${state.compare.includes(p.id)?'取消对比':'加入对比'}</button></div></article>`}
function results(){let m=matches();shell(`<div class="page-head"><p class="eyebrow">问心 · 寻解</p><h2>根据您的选择，我们找到了这些可能适合您的服务。</h2><p class="muted">仅根据产品原始说明与您的选择进行初步匹配，不保证效果。</p></div><div class="result-grid"><aside class="summary"><h3>您的探索路径</h3><pre>${esc(summary())}</pre><button data-action="copy">复制我的需求摘要</button><button data-action="explore">修改选择</button></aside><section class="results">${m.length?m.map((x,i)=>card(x.p,x.why,i)).join(''):`<div class="empty"><h3>目前没有找到足够匹配的服务</h3><p>建议先进行人工咨询，或返回调整探索条件。没有明确依据时，我们不会强行推荐产品。</p><button data-action="contact">查看咨询方式</button></div>`}<div class="subactions"><button data-action="restart">重新探索</button><button data-action="catalog">查看其他服务</button></div></section></div>`)}
function catalog(){let cats=['全部',...new Set(P.map(p=>p.category))],q=state.query.toLowerCase(),items=P.filter(p=>(state.filter==='全部'||p.category===state.filter)&&[p.name,p.subcategory,p.note,p.price,...p.tags].join(' ').toLowerCase().includes(q));shell(`<div class="page-head"><p class="eyebrow">玉瑶司 · 服务图鉴</p><h2>一览所藏，按需寻访。</h2><p class="muted">共 ${P.length} 条原始记录。价格及服务描述均保留原始表述；缺失信息标注待补充。</p></div><div class="toolbar"><input id="search" type="search" placeholder="搜索服务、关键词、价格…" value="${esc(state.query)}" aria-label="搜索服务"><div class="filters">${cats.map(c=>`<button data-filter="${esc(c)}" class="${state.filter===c?'selected':''}">${esc(c)}</button>`).join('')}</div></div><p class="count">当前显示 ${items.length} 项</p><div class="catalog-grid">${items.map(p=>card(p,[],99)).join('')||'<p>没有搜索结果，请更换关键词。</p>'}</div>${state.compare.length?`<div class="comparebar">已选择 ${state.compare.length} 项 <button data-action="compare">对比产品</button><button data-action="clearcompare">清空</button></div>`:''}`)}
function detail(id){let p=P.find(x=>x.id===id);if(!p)return catalog();shell(`<div class="page-head"><p class="eyebrow">服务详情 · ${esc(p.id)}</p><h2>${esc(p.name)}</h2><p>${esc(p.category)} / ${esc(p.subcategory)}</p></div><div class="detail"><div class="price">${esc(p.price)}${/^\d+$/.test(p.price)?' 元':''}</div>${[['原始介绍 / 备注',p.note],['有效期 / 规格',p.term],['属性',p.kind],['适用需求（根据原始内容归纳的标签）',p.tags.join('、')||'待补充'],['适用范围',p.applicable],['不适用情况',p.notApplicable],['服务形式',p.serviceForm],['使用或服务说明',p.instructions]].map(([k,v])=>`<div class="detail-row"><b>${esc(k)}</b><p>${esc(v)}</p></div>`).join('')}<div class="actions"><button class="primary" data-consult="${p.id}">咨询这项服务</button><button data-action="catalog">返回图鉴</button><button data-action="results">返回推荐</button></div></div>`)}
function consult(id){let p=P.find(x=>x.id===id);shell(`<div class="page-head"><p class="eyebrow">咨询 · 沟通</p><h2>把您的问题，带给我们。</h2></div><div class="detail"><p>意向服务：<b>${esc(p?.name||'待确认')}</b></p><pre>${esc(summary())}</pre><p class="muted">客服微信、二维码与购买链接尚未配置。请管理员在配置文件中填写真实联系方式。</p><div id="contact-links"></div><div class="actions"><button class="primary" data-action="copyconsult" data-id="${esc(id||'')}">复制咨询内容</button><button data-action="catalog">返回服务图鉴</button></div></div>`);let cfg=window.YY_CONTACT||{},box=$('#contact-links');if(cfg.wechat)box.insertAdjacentHTML('beforeend',`<p>微信：${esc(cfg.wechat)}</p>`);if(cfg.url&&/^https:\/\//.test(cfg.url)) {let a=document.createElement('a');a.href=cfg.url;a.target='_blank';a.rel='noopener noreferrer';a.textContent='打开咨询或购买页面';box.append(a)}if(cfg.qr&&/^https:\/\//.test(cfg.qr)){let img=document.createElement('img');img.src=cfg.qr;img.alt='客服二维码';img.className='qr';box.append(img)}}
function about(){shell(`<div class="page-head"><p class="eyebrow">ABOUT · 玉瑶司</p><h2>先问心，再寻解。</h2></div><div class="detail"><p>「问心寻解」是玉瑶司的服务导航工具：从您当前的困惑出发，了解可能相关的传统文化产品、咨询、课程与服务。</p><p>本工具不要求填写姓名、电话或身份证号；默认不向服务器上传探索答案。商品与服务的描述来自管理员提供的原始表格，未提供的信息均标记为待补充。</p><p class="fine">传统祈福、符箓及相关服务属于文化与信仰实践，不应替代医疗、心理治疗、法律或财务专业服务。对于重要现实决策，请咨询适当的专业人士。</p><button class="primary" data-action="start">开始探索</button></div>`)}
function compare(){let ps=state.compare.map(id=>P.find(p=>p.id===id)).filter(Boolean);shell(`<div class="page-head"><h2>服务对比</h2><p>最多对比 3 项，所有字段均来源于原始记录。</p></div><div class="comparison">${ps.map(p=>card(p,[],99)).join('')||'请先在服务图鉴中选择产品。'}</div><button data-action="catalog">返回服务图鉴</button>`)}
function copy(text){if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(text).then(()=>alert('已复制')).catch(()=>fallback(text));else fallback(text)}function fallback(t){let a=document.createElement('textarea');a.value=t;document.body.append(a);a.select();try{document.execCommand('copy');alert('已复制')}catch(e){alert('请手动复制需求摘要')}a.remove()}
function bind(){app.querySelectorAll('[data-action]').forEach(b=>b.addEventListener('click',()=>{let a=b.dataset.action;if(a==='home')go('home');if(a==='start')restart();if(a==='unsure'){restart();choose('不确定','我还不确定')}if(a==='explore'){state.view='explore';render()}if(a==='catalog')go('catalog');if(a==='about')go('about');if(a==='results')go('results');if(a==='restart')restart();if(a==='contact')consult(null);if(a==='compare')go('compare');if(a==='clearcompare'){state.compare=[];render()}if(a==='copy')copy('玉瑶司 · 我的需求摘要\n'+summary());if(a==='copyconsult'){let p=P.find(x=>x.id===b.dataset.id);copy('玉瑶司 · 咨询需求\n意向服务：'+(p?.name||'待确认')+'\n'+summary())}}));app.querySelectorAll('[data-choose]').forEach(b=>b.addEventListener('click',()=>choose(b.dataset.choose,b.dataset.label)));app.querySelectorAll('[data-back]').forEach(b=>b.addEventListener('click',()=>back(Number(b.dataset.back))));app.querySelectorAll('[data-detail]').forEach(b=>b.addEventListener('click',()=>{state.detail=b.dataset.detail;go('detail')}));app.querySelectorAll('[data-consult]').forEach(b=>b.addEventListener('click',()=>{state.detail=b.dataset.consult;go('consult')}));app.querySelectorAll('[data-compare]').forEach(b=>b.addEventListener('click',()=>{let id=b.dataset.compare;if(state.compare.includes(id))state.compare=state.compare.filter(x=>x!==id);else if(state.compare.length<3)state.compare.push(id);else return alert('最多选择 3 项对比');render()}));app.querySelectorAll('[data-filter]').forEach(b=>b.addEventListener('click',()=>{state.filter=b.dataset.filter;render()}));let search=$('#search');if(search)search.addEventListener('input',()=>{state.query=search.value;let start=search.selectionStart;catalog();let el=$('#search');el.focus();el.setSelectionRange(start,start)})}
function render(){save();if(state.view==='home')home();else if(state.view==='explore')explore();else if(state.view==='results')results();else if(state.view==='catalog')catalog();else if(state.view==='detail')detail(state.detail);else if(state.view==='consult')consult(state.detail);else if(state.view==='about')about();else if(state.view==='compare')compare();else home();window.scrollTo(0,0)}
try{let saved=JSON.parse(sessionStorage.getItem('yy_session'));if(saved&&Array.isArray(saved.answers)&&Number.isInteger(saved.step))state={...state,...saved}}catch(e){};
window.YY_APP={restart,render,products:P,matches};render();
})();
</script></body></html>
