function explore(){let n=Math.min(S.step,3),opts=n===0?ROOT:n===1?(SUB[S.answers[0]?.value]||SUB['不确定']):n===2?FORM:(DETAILS[S.answers[2]?.value]||DETAILS['不限']);let title=['您目前最想了解什么？','哪一种情况更贴近您？','您希望获得怎样的帮助？','进一步了解您的偏好'][n];header(`<div class="explore-layout">${path()}<section class="question"><p class="eyebrow">第 ${n+1} / 4 步</p><h2>${title}</h2><p class="muted">选择最贴近您当前情况的一项；您可以随时返回修改。</p><div class="choices">${opts.map(([l,v])=>button(l,v)).join('')}</div><div class="subactions"><button data-act="results">先看看推荐</button><button data-act="restart">重新探索</button><button data-act="catalog">直接查看服务</button></div></section></div>`)}
function match(p){let a=S.answers,primary=a[1]?.value||a[0]?.value,top=a[0]?.value,form=a[2]?.value,detail=a[3]?.value,t=p.tags,score=0,why=[];if(!primary)return {score:-1,why};if(t.includes(primary)){score+=65;why.push(`对应您关注的「${a[1]?.label||a[0]?.label}」`)}else if(t.includes(top)){score+=25;why.push('与您选择的关注方向有关')}
 const fm={咨询:['咨询'],仪式:['传统仪式','法会','祈福'],物品:['实体物品'],事务:['风水','择日','开光'],学习:['学习'],食品:['食品']};if(form&&form!=='不限'){if((fm[form]||[]).some(x=>t.includes(x))){score+=30;why.push('符合您偏好的帮助形式')}else score-=45}
 if(detail&&detail!=='不限'){if(t.includes(detail)){score+=24;why.push('与进一步偏好相符')}else score-=12}
 // A universal cultural option, not an assertion of efficacy. Only surface when user has completed a meaningful path.
 if(p.subcategory==='符箓大类'){score=Math.max(score,49);why=['可作为进一步了解的传统符箓祈福选项；具体形式与适用方向需人工沟通确认']}
 if(primary==='求子'&&p.subcategory!=='符箓大类'&&!t.includes('求子'))score=-1;
 if(primary==='图鉴')score=-1;
 return {score,why}}
function matches() {
  if (!S.answers.length) return [];
  const all = P.map(p => ({p,...match(p)}))
    .filter(x => x.score >= 49 && x.why.length)
    .sort((a,b) => b.score-a.score || a.p.id.localeCompare(b.p.id));
  const names = new Set();
  for (const item of all) {
    if (!names.has(item.p.name) && names.size >= 3) break;
    names.add(item.p.name);
  }
  return all.filter(item => names.has(item.p.name));
}

function summary(){return S.answers.map((a,i)=>`${STAGES[i]}：${a.label}`).join('\n')||'尚未完成探索'}
function listItem(p){return `<button class="product-row" data-detail="${p.id}"><span>${escape(p.name)}</span><b>${escape(p.price)}${/^\d+$/.test(p.price)?' 元':''}</b></button>`}
function resultCard(x,i){let p=x.p;return `<article class="card"><p class="eyebrow">${i===0?'优先匹配':'其他可考虑'}</p><p class="chip">${escape(p.category)} / ${escape(p.subcategory)}</p><h3>${escape(p.name)}</h3><p class="price">${escape(p.price)}${/^\d+$/.test(p.price)?' 元':''}</p><p class="reason">根据您提供的信息，这项服务可能符合您的需求。${escape(x.why.join('；'))}。</p><div class="actions"><button data-detail="${p.id}">查看详细介绍</button><button data-consult="${p.id}">咨询这项服务</button></div></article>`}
function results(){let m=matches();header(`<div class="page-head"><p class="eyebrow">问心 · 寻解</p><h2>根据您的选择，我们找到了这些可能适合您的服务。</h2><p class="muted">推荐为初步信息匹配，不代表对结果的保证。</p></div><div class="result-grid"><aside class="summary"><h3>您的探索路径</h3><pre>${escape(summary())}</pre><button data-act="copy">复制我的需求摘要</button><button data-act="edit">修改选择</button></aside><section class="results">${m.length?m.map(resultCard).join(''):`<div class="empty"><h3>推荐进一步深入沟通</h3><p>目前信息不足以匹配具体服务。可以在群里，或联系曾曾、火火进一步沟通。</p></div>`}<div class="subactions"><button data-act="restart">重新探索</button><button data-act="catalog">查看其他服务</button></div></section></div>`)}
function catalog(){let q=S.query.trim().toLowerCase(),items=P.filter(p=>[p.name,p.category,p.subcategory,p.price,p.remark,p.description,...p.tags].join(' ').toLowerCase().includes(q));let cats=S.category?[S.category]:C;let content=cats.map(cat=>{let ps=items.filter(p=>p.category===cat);if(!ps.length)return '';let subs=[...new Set(ps.map(p=>p.subcategory))];return `<section class="catalog-cat"><button class="cat-heading" data-cat="${escape(cat)}"><span>${escape(cat)} <small>${ps.length} 项</small></span><span>${S.category===cat?'－':'＋'}</span></button>${S.category===cat?`<div class="subgroups">${subs.map(sub=>`<section class="subgroup"><button class="sub-heading" data-sub="${escape(sub)}">${escape(sub)} <small>${ps.filter(p=>p.subcategory===sub).length} 项</small> <span>${S.sub===sub?'－':'＋'}</span></button>${S.sub===sub?`<div class="products">${ps.filter(p=>p.subcategory===sub).map(listItem).join('')}</div>`:''}</section>`).join('')}</div>`:''}</section>`}).join('');header(`<div class="page-head"><p class="eyebrow">玉瑶司 · 服务图鉴</p><h2>一览所藏，按需寻访。</h2><p class="muted">玉瑶司有求必应。愿以诚心承接诸位困惑，循理答疑，助君拨开迷障，寻得心安与方向。</p></div><div class="toolbar"><input id="search" type="search" placeholder="搜索名称、分类或关键词" value="${escape(S.query)}"><button data-act="allcats">全部大类</button></div><div class="catalog-tree">${content||'<div class="empty">没有找到相关服务，请更换关键词。</div>'}</div><div class="subactions bottom"><button data-act="restart">返回需求探索</button><button data-act="compare">查看产品对比（${S.compare.length}/3）</button></div>`)}
function detail(){let p=P.find(x=>x.id===S.detail);if(!p){view('catalog');return}header(`<div class="page-head"><p class="eyebrow">服务详情 · ${escape(p.id)}</p><h2>${escape(p.name)}</h2><p class="muted">${escape(p.category)} / ${escape(p.subcategory)}</p></div><article class="detail"><img class="yy-square-image" src="images/${escape(p.id)}.jpg" alt="${escape(p.name)}" loading="lazy" onerror="this.hidden=true"/><p class="price">${escape(p.price)}${/^\d+$/.test(p.price)?' 元':''}</p><div class="detail-row"><b>详细描述</b><p>${escape(p.description)}</p></div><div class="detail-row"><b>备注 / 规格 / 服务条件</b><p>${escape(p.remark)}</p></div><div class="actions"><button data-consult="${p.id}">咨询这项服务</button><button data-compare="${p.id}">${S.compare.includes(p.id)?'取消对比':'加入对比'}</button><button data-act="catalog">返回服务图鉴</button><button data-act="results">返回推荐</button></div></article>`)}
function consult(){let p=P.find(x=>x.id===S.detail);header(`<div class="page-head"><p class="eyebrow">进一步沟通</p><h2>把您的问题，带给我们。</h2></div><div class="detail"><p>意向服务：<b>${escape(p?.name||'尚未确定')}</b></p><pre>${escape(summary())}</pre><p>可以在群里，或者联系<strong>曾曾或火火</strong>进行进一步沟通。</p><p class="muted">本页面不提供联系方式，也不会自动上传您的选择。</p><div class="actions"><button data-act="copyconsult">复制咨询摘要</button><button data-act="catalog">查看全部服务</button><button data-act="results">返回推荐</button></div></div>`)}
function about(){header(`<div class="page-head"><p class="eyebrow">ABOUT · 玉瑶司</p><h2>先问心，再寻解。</h2></div><div class="detail"><img class="yy-square-image yy-about-image" src="images/about.jpg" alt="玉瑶司" loading="lazy" onerror="this.hidden=true"/><p>「问心寻解」是玉瑶司的互动服务导航：从当前困惑出发，了解可能相关的实体产品、食品、咨询、课程、法会与开光服务。</p><p>如果希望进一步了解，可以在群里或者联系曾曾或火火沟通。本页面不公开联系方式。</p><p class="muted">服务描述保留原始提供文本，其中传统功效属于商家描述与文化信仰表述，不应被理解为经科学验证的效果承诺。食品及身心相关服务不替代医疗诊断或治疗。</p><button class="primary" data-act="start">开始探索</button></div>`)}
function compare(){let ps=S.compare.map(id=>P.find(p=>p.id===id)).filter(Boolean);header(`<div class="page-head"><h2>服务对比</h2><p class="muted">最多对比 3 项</p></div><div class="comparison">${ps.length?ps.map(p=>`<article class="card"><h3>${escape(p.name)}</h3><p class="chip">${escape(p.category)} / ${escape(p.subcategory)}</p><p class="price">${escape(p.price)}</p><p>${escape(p.description)}</p><button data-detail="${p.id}">查看详情</button><button data-compare="${p.id}">移除</button></article>`).join(''):'<p>请先在图鉴或详情页添加需要对比的服务。</p>'}</div><button data-act="catalog">返回服务图鉴</button>`)}
function copy(t){if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(t).then(()=>alert('已复制')).catch(()=>fallback(t));else fallback(t)}function fallback(t){let el=document.createElement('textarea');el.value=t;document.body.append(el);el.select();try{document.execCommand('copy');alert('已复制')}catch{alert('请手动复制')}el.remove()}
function bind(){document.querySelectorAll('[data-act]').forEach(b=>b.addEventListener('click',()=>{let a=b.dataset.act;if(a==='home')view('home');else if(a==='start'||a==='restart')start();else if(a==='unsure'){start();choose('不确定','我不确定属于哪类')}else if(a==='previous')previous();else if(a==='explore'){if(S.step>=4)S.step=3;view('explore')}else if(a==='edit')back(Math.max(0,S.answers.length-1));else if(a==='results')view('results');else if(a==='catalog')view('catalog');else if(a==='about')view('about');else if(a==='allcats'){S.category=null;S.sub=null;view('catalog')}else if(a==='compare')view('compare');else if(a==='copy')copy('玉瑶司 · 需求摘要\n'+summary());else if(a==='copyconsult'){let p=P.find(x=>x.id===S.detail);copy('玉瑶司 · 咨询摘要\n意向服务：'+(p?.name||'待确认')+'\n'+summary())}}));document.querySelectorAll('[data-choice]').forEach(b=>b.addEventListener('click',()=>{if(b.dataset.choice==='图鉴'){view('catalog');return}choose(b.dataset.choice,b.dataset.label)}));document.querySelectorAll('[data-back]').forEach(b=>b.addEventListener('click',()=>back(Number(b.dataset.back))));document.querySelectorAll('[data-cat]').forEach(b=>b.addEventListener('click',()=>{S.category=S.category===b.dataset.cat?null:b.dataset.cat;S.sub=null;render()}));document.querySelectorAll('[data-sub]').forEach(b=>b.addEventListener('click',()=>{S.sub=S.sub===b.dataset.sub?null:b.dataset.sub;render()}));document.querySelectorAll('[data-detail]').forEach(b=>b.addEventListener('click',()=>{view('detail');S.detail=b.dataset.detail;render()}));document.querySelectorAll('[data-consult]').forEach(b=>b.addEventListener('click',()=>{view('consult');S.detail=b.dataset.consult;render()}));document.querySelectorAll('[data-compare]').forEach(b=>b.addEventListener('click',()=>{let id=b.dataset.compare;if(S.compare.includes(id))S.compare=S.compare.filter(x=>x!==id);else if(S.compare.length<3)S.compare.push(id);else{alert('最多对比3项');return}render()}));let input=$('#search');if(input)input.addEventListener('input',()=>{let pos=input.selectionStart;S.query=input.value;catalog();let next=$('#search');next.focus();next.setSelectionRange(pos,pos)})}
function render(){persist();({home,explore,results,catalog,detail,consult,about,compare}[S.view]||home)();window.scrollTo(0,0)}
try{let saved=JSON.parse(sessionStorage.getItem('yy_v2'));if(saved&&Array.isArray(saved.answers)&&Number.isInteger(saved.step)&&saved.step>=0&&saved.step<=4)S={...S,...saved,history:Array.isArray(saved.history)?saved.history:[]}}catch{}
window.YY_APP={products:P,matches,start,previous,render,ROOT,SUB};render();
})();
</script></body></html>
